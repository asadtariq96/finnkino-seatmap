<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeatFlash — C: City explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c12;--panel:#0f131b;--raised:#161c26;--hover:#1b2230;--line:#232c3a;--soft:#171d28;--text:#eef1f6;--muted:#96a0b1;--dim:#5e6877;--accent:#f3bc4b;--screen:#7fb7e0;--free:#2eaf53;--sold:#34363b;--hold:#d8b94a}
html,body{height:100%}
body{font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:0 10px;height:46px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.brand{font-weight:800;letter-spacing:.5px;white-space:nowrap}.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(243,188,75,.7);margin-right:8px}
.cities{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.cities button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600}
.cities button.active{background:var(--raised);color:var(--accent)}
.days{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.day{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.day:hover{background:var(--hover);color:var(--text)}.day.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ctl{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.ctl button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px}
.ctl button.active{background:var(--raised);color:var(--accent)}
.top input{height:28px;width:160px;border:1px solid var(--line);border-radius:6px;background:var(--raised);color:var(--text);padding:0 8px;outline:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}
.cityview{min-width:0;min-height:0;overflow:auto;padding:10px 14px 24px}
.cinema-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.cinema-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--soft);cursor:pointer}
.cinema-head:hover{background:var(--hover)}
.ch-name{font:700 15px/1.2 system-ui;letter-spacing:.2px}
.ch-city{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.ch-count{margin-left:auto;font-size:11px;color:var(--muted)}
.ch-arrow{color:var(--dim);font-size:11px;transition:transform .15s}
.cinema-card.open .ch-arrow{transform:rotate(90deg)}
.cinema-body{display:none;padding:6px 14px 12px}
.cinema-card.open .cinema-body{display:block}
.mrow{padding:8px 4px;border-bottom:1px solid var(--soft)}
.mrow:last-child{border-bottom:0}
.mrow-top{display:flex;align-items:baseline;gap:8px}
.mname{font-weight:650}
.mfmt{font-size:9px;color:var(--dim);font-family:ui-monospace,monospace}
.mtimes{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11px;display:inline-flex;flex-direction:column;align-items:flex-start;min-width:52px;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.chip .t{font-weight:650;font-variant-numeric:tabular-nums}
.chip .p{font-size:8.5px;color:var(--free)}
.chip.sold{opacity:.35;text-decoration:line-through;cursor:default}
.cinema-card.closed .mrow{display:none}
.summary-row{display:flex;gap:10px;padding:6px 2px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.stat{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;background:var(--raised);padding:6px 10px;font-size:11px;color:var(--muted)}
.stat b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.seatpane{min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.seat-head{padding:8px 14px;border-bottom:1px solid var(--line);min-height:50px}
.sh1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh2{font-size:11px;color:var(--muted);margin-top:1px}
.stats{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted)}
.stats strong{color:var(--text)}
.seat-map{flex:1;min-height:0;overflow:auto;display:grid;place-items:start center;padding:12px 16px 22px}
.map-inner{min-width:min-content}
.screen{height:5px;width:75%;margin:0 auto 6px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--screen) 15% 85%,transparent);box-shadow:0 -7px 22px rgba(127,183,224,.28)}
.screen-label{text-align:center;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.area-label{text-align:center;font-size:10px;color:var(--muted);margin:6px 0 4px}
.grid{display:grid;gap:2px;justify-content:center}
.seat{width:10px;height:10px;border-radius:2px;border:0;padding:0;background:var(--sold)}
.seat.av{background:var(--free)}.seat.held{background:var(--hold)}
.legend{display:flex;justify-content:center;gap:12px;margin-top:10px;font-size:10px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.placeholder{color:var(--dim);text-align:center;padding:50px 20px;align-self:center}
</style>
<div class="top">
  <div class="brand"><i></i>SEATFLASH</div>
  <div class="cities" id="cities"><button data-c="Helsinki" class="active">Helsinki</button><button data-c="Tampere">Tampere</button><button data-c="Turku">Turku</button><button data-c="All">All</button></div>
  <div class="days" id="days"></div>
  <div class="ctl" id="fmt"><button data-f="All" class="active">All</button><button data-f="IMAX">IMAX</button><button data-f="3D">3D</button></div>
  <input id="q" placeholder="Filter movies…">
</div>
<div class="main">
  <section class="cityview" id="view"></section>
  <aside class="seatpane">
    <div class="seat-head"><div class="sh1" id="sTitle">Select a show</div><div class="sh2" id="sSub">Pick a cinema, then a showtime</div><div class="stats" id="stats"></div></div>
    <div class="seat-map" id="map"><div class="placeholder">No show selected</div></div>
  </aside>
</div>
<script>
const CITIES={Helsinki:["Kinopalatsi Helsinki","Tennispalatsi Helsinki","Itis Helsinki","Maxim Helsinki"],Tampere:["Plevna Tampere","Cine Atlas Tampere"],Turku:["Kinopalatsi Turku"]};
const DATA=[
 ["Dune: Part Three","IMAX",{"Kinopalatsi Helsinki":["12:00","15:45","19:30"],"Tennispalatsi Helsinki":["13:15","17:00","21:30"],"Itis Helsinki":["14:00","18:15","22:00"],"Plevna Tampere":["16:00","20:00"]}],
 ["Backrooms: Everything Must Go Edition","2D",{"Kinopalatsi Helsinki":["13:00","18:15"],"Tennispalatsi Helsinki":["15:30","21:00"],"Maxim Helsinki":["16:10","20:10"],"Cine Atlas Tampere":["17:45"]}],
 ["Spider-Man: Brand New Day","2D/3D",{"Itis Helsinki":["12:30","18:00"],"Kinopalatsi Helsinki":["15:10","21:15"],"Plevna Tampere":["13:00","19:30"],"Kinopalatsi Turku":["14:20","20:40"]}],
 ["Sisu 2","2D",{"Tennispalatsi Helsinki":["13:45","19:15"],"Itis Helsinki":["16:30","22:00"]}],
 ["Frozen IV","3D",{"Kinopalatsi Helsinki":["13:00","18:30"],"Plevna Tampere":["15:45","21:00"]}],
 ["Flow","2D",{"Itis Helsinki":["14:15","19:00"],"Kinopalatsi Turku":["16:45"]}],
 ["Napoleon: The Director's Cut","IMAX",{"Kinopalatsi Helsinki":["12:45","21:30"],"Cine Atlas Tampere":["17:00"]}],
 ["Koiramies","2D",{"Tennispalatsi Helsinki":["13:15","18:45"],"Maxim Helsinki":["16:00"]}],
 ["Miffy elokuva","2D",{"Kinopalatsi Turku":["12:00","14:00"],"Plevna Tampere":["15:30"]}],
 ["Joker: Folie à Deux","2D",{"Kinopalatsi Helsinki":["15:00","21:45"],"Itis Helsinki":["18:15"]}],
];
let open=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pct(t){const s=t.split("").reduce((a,c)=>a+c.charCodeAt(0),0);return 40+(s%58)}
function renderDays(){const names=["Today","Tomorrow"],el=document.querySelector("#days");el.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const l=names[i]||d.toLocaleDateString("en",{weekday:"short",day:"numeric"});return `<button class="day ${i===0?'active':''}">${l}</button>`})}
function render(){
  const city=document.querySelector("#cities .active").dataset.c,f=document.querySelector("#fmt .active").dataset.f,q=document.querySelector("#q").value.toLowerCase();
  const cinemas=city==="All"?Object.values(CITIES).flat():CITIES[city];
  const byCin={};
  for(const cn of cinemas)byCin[cn]=[];
  for(const [name,fmt,byC] of DATA){
    if(q&&!name.toLowerCase().includes(q))continue;
    if(f!=="All"&&!fmt.includes(f))continue;
    for(const [cn,times] of Object.entries(byC))if(byCin[cn])byCin[cn].push([name,fmt,times]);
  }
  let totalShows=0,totalFree=0;
  const cards=cinemas.map(cn=>{
    const rows=byCin[cn].sort((a,b)=>a[0].localeCompare(b[0]));
    const shows=rows.reduce((n,r)=>n+r[2].length,0);totalShows+=shows;
    const isOpen=open===cn;
    return `<div class="cinema-card ${isOpen?'open':'closed'}" data-cn="${esc(cn)}">
      <div class="cinema-head"><div><div class="ch-name">${cn}</div><div class="ch-city">${city}</div></div><div class="ch-count">${rows.length} films · ${shows} shows</div><div class="ch-arrow">▶</div></div>
      <div class="cinema-body">${rows.map(([name,fmt,times])=>`<div class="mrow"><div class="mrow-top"><span class="mname">${name}</span><span class="mfmt">${fmt}</span></div><div class="mtimes">${times.map(t=>`<button class="chip" data-m="${esc(name)}" data-c="${esc(cn)}" data-t="${t}"><span class="t">${t}</span><span class="p">${pct(t)}% free</span></button>`).join("")}</div></div>`).join("")}</div>
    </div>`;
  });
  document.querySelector("#view").innerHTML=`<div class="summary-row"><div class="stat"><b>${cinemas.length}</b>cinemas</div><div class="stat"><b>${totalShows}</b>shows today</div><div class="stat"><b>${DATA.length}</b>films</div></div>`+cards.join("");
}
function seatmap(t){
  const cols=14,rows=8,g=document.createElement("div");g.className="grid";g.style.gridTemplateColumns=`repeat(${cols},10px)`;
  let n=0;const seed=t.split("").reduce((a,c)=>a+c.charCodeAt(0),0);const rnd=()=>{const x=Math.sin(n++*seed)*10000;return x-Math.floor(x)};let av=0;
  const p=pct(t);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const rv=rnd(),cls=rv<p/100?"av":rv<.95?"":"held";if(cls==="av")av++;const b=document.createElement("button");b.className=`seat ${cls}`;g.appendChild(b)}
  const w=document.createElement("div");w.className="map-inner";
  w.innerHTML=`<div class="screen"></div><div class="screen-label">SCREEN</div><div class="area-label">Katsomo</div>`;
  w.appendChild(g);
  w.innerHTML+=`<div class="legend"><span><i class="dot" style="background:var(--free)"></i>Available</span><span><i class="dot" style="background:var(--sold)"></i>Unavailable</span><span><i class="dot" style="background:var(--hold)"></i>Held</span></div>`;
  return [w,av];
}
function load(m,c,t){document.querySelector("#sTitle").textContent=m;document.querySelector("#sSub").textContent=`${c} · ${t}`;const [map,av]=seatmap(t+c);const mm=document.querySelector("#map");mm.innerHTML="";mm.appendChild(map);document.querySelector("#stats").innerHTML=`<span><strong>${av}</strong> free</span><span><strong>${Math.round(av/112*100)}%</strong> open</span>`}
document.querySelector("#cities").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#cities button").forEach(x=>x.classList.toggle("active",x===b));open=null;render()};
document.querySelector("#fmt").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#fmt button").forEach(x=>x.classList.toggle("active",x===b));render()};
document.querySelector("#q").oninput=render;
document.querySelector("#view").onclick=e=>{
  const chip=e.target.closest(".chip");if(chip)return load(chip.dataset.m,chip.dataset.c,chip.dataset.t);
  const head=e.target.closest(".cinema-head");if(head){const card=head.closest(".cinema-card");open=card.dataset.cn===open?null:card.dataset.cn;render()}
};
renderDays();render();
</script>
</html>
