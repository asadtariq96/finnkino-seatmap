<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeatFlash — Variant C: Unified</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c12;--panel:#0f131b;--raised:#161c26;--hover:#1b2230;--line:#232c3a;--soft:#171d28;--text:#eef1f6;--muted:#96a0b1;--dim:#5e6877;--accent:#f3bc4b;--accent-ink:#17120a;--screen:#7fb7e0;--free:#2eaf53;--sold:#34363b;--hold:#d8b94a}
html,body{height:100%}
body{font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.brand{font-weight:800;letter-spacing:.5px;white-space:nowrap}.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(243,188,75,.7);margin-right:8px}
.days{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.day{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.day:hover{background:var(--hover);color:var(--text)}.day.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ctl{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.ctl button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px}
.ctl button.active{background:var(--raised);color:var(--accent)}
.top input{height:28px;width:170px;border:1px solid var(--line);border-radius:6px;background:var(--raised);color:var(--text);padding:0 8px;outline:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px}
.list{min-width:0;min-height:0;display:flex;flex-direction:column}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;flex:0 0 auto}
.rows{flex:1;overflow:auto;padding:6px 8px}
.movie{padding:8px 10px;border:1px solid transparent;border-radius:8px;margin-bottom:2px}
.movie:hover{background:var(--hover)}
.movie.sel{background:var(--raised);border-color:var(--line)}
.m-row{display:flex;align-items:baseline;gap:8px}
.m-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-fmt{font-size:9px;color:var(--dim);white-space:nowrap;font-family:ui-monospace,monospace}
.cinemas{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.cg{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:start}
.cg-name{font-size:10.5px;color:var(--muted);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-times{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;min-width:48px;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:#3c3118;border-color:rgba(243,188,75,.55)}
.chip .t{font-weight:650;font-variant-numeric:tabular-nums}
.chip .f{font-size:8.5px;color:var(--muted);letter-spacing:.3px}
.chip.on .f{color:#e8c87f}
.chip.sold{opacity:.35;text-decoration:line-through}
.seatpane{min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.seat-head{padding:9px 14px;border-bottom:1px solid var(--line);min-height:50px}
.sh1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh2{font-size:11px;color:var(--muted);margin-top:1px}
.stats{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted)}
.stats strong{color:var(--text)}
.seat-map{flex:1;min-height:0;overflow:auto;display:grid;place-items:start center;padding:12px 16px 22px}
.map-inner{min-width:min-content}
.screen{height:5px;width:75%;margin:0 auto 6px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--screen) 15% 85%,transparent);box-shadow:0 -7px 22px rgba(127,183,224,.28)}
.screen-label{text-align:center;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.area-label{text-align:center;font-size:10px;color:var(--muted);margin:6px 0 4px}
.grid{display:grid;gap:2px;justify-content:center}
.seat{width:10px;height:10px;border-radius:2px;border:0;padding:0;background:var(--sold);cursor:pointer}
.seat.av{background:var(--free)}.seat.held{background:var(--hold)}.seat.wc{border-radius:50%}
.seat:hover{transform:scale(1.6);box-shadow:0 0 0 2px var(--bg)}
.legend{display:flex;justify-content:center;gap:12px;margin-top:10px;font-size:10px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.placeholder{color:var(--dim);text-align:center;padding:50px 20px;align-self:center}
@media(max-width:1100px){.main{grid-template-columns:1fr}.seatpane{display:none}}
</style>
<div class="top">
  <div class="brand"><i></i>SEATFLASH</div>
  <div class="days" id="days"></div>
  <div class="ctl" id="scope"><button data-s="all" class="active">All cinemas</button><button data-s="one">One cinema</button></div>
  <input id="q" placeholder="Filter movies…">
</div>
<div class="main">
  <section class="list">
    <div class="list-head"><span>Movies &amp; showtimes</span><span id="count"></span></div>
    <div class="rows" id="rows"></div>
  </section>
  <aside class="seatpane">
    <div class="seat-head">
      <div class="sh1" id="sTitle">Select a show</div>
      <div class="sh2" id="sSub">One click on a showtime lights up the auditorium</div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="seat-map" id="map"><div class="placeholder">No show selected</div></div>
  </aside>
</div>
<script>
const CINEMAS=["Kinopalatsi Helsinki","Tennispalatsi Helsinki","Itis Helsinki","Flamingo Vantaa","Sello Espoo"];
const DATA=[
 ["Backrooms: Everything Must Go Edition","2D",{"Kinopalatsi Helsinki":["13:00","18:15"],"Tennispalatsi Helsinki":["15:30","21:00"]}],
 ["Spider-Man: Brand New Day","2D/3D",{"Itis Helsinki":["12:30","18:00"],"Flamingo Vantaa":["15:10","21:15"]}],
 ["Ryhmä Hau: Dinoelokuva","2D",{"Kinopalatsi Helsinki":["12:15","17:00"],"Sello Espoo":["14:30"]}],
 ["Sisu 2","2D",{"Tennispalatsi Helsinki":["13:45","19:15"],"Itis Helsinki":["16:30","22:00"]}],
 ["Dune: Part Three","IMAX",{"Flamingo Vantaa":["12:00","19:30"],"Kinopalatsi Helsinki":["15:45","23:00"]}],
 ["Frozen IV","3D",{"Sello Espoo":["13:00","18:30"],"Tennispalatsi Helsinki":["15:45","21:00"]}],
 ["Flow","2D",{"Itis Helsinki":["14:15","19:00"],"Sello Espoo":["16:45"]}],
 ["Napoleon: The Director's Cut","IMAX",{"Kinopalatsi Helsinki":["12:45","21:30"],"Flamingo Vantaa":["17:00"]}],
 ["Koiramies","2D",{"Tennispalatsi Helsinki":["13:15","18:45"],"Itis Helsinki":["16:00"]}],
 ["Miffy elokuva","2D",{"Sello Espoo":["12:00"],"Flamingo Vantaa":["14:00"]}],
 ["Joker: Folie à Deux","2D",{"Kinopalatsi Helsinki":["15:00","21:45"],"Itis Helsinki":["18:15"]}],
 ["Conclave","2D",{"Tennispalatsi Helsinki":["13:30","19:00"],"Sello Espoo":["16:15","21:30"]}],
];
let sel=null;
function renderDays(){const names=["Today","Tomorrow"],el=document.querySelector("#days");el.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const l=names[i]||d.toLocaleDateString("en",{weekday:"short",day:"numeric"});return `<button class="day ${i===0?'active':''}">${l}</button>`})}
function render(){
  const q=document.querySelector("#q").value.toLowerCase(),one=document.querySelector("#scope .active").dataset.s==="one";
  const rows=DATA.filter(m=>m[0].toLowerCase().includes(q));
  document.querySelector("#count").textContent=rows.length+" films";
  document.querySelector("#rows").innerHTML=rows.map((m,mi)=>{
    const [name,fmt,byCin]=m;
    const groups=one?{"":Object.values(byCin).flat().map(t=>[t,fmt])}:Object.entries(byCin);
    return `<div class="movie ${sel&&sel.mi===mi?'sel':''}" data-mi="${mi}"><div class="m-row"><span class="m-name">${name}</span><span class="m-fmt">${fmt}</span></div><div class="cinemas">${groups.map(([cn,times])=>`<div class="cg"><div class="cg-name">${cn||""}</div><div class="cg-times">${times.map((t,ti)=>{const tt=Array.isArray(t)?t[0]:t,ff=Array.isArray(t)?t[1]:fmt;return `<button class="chip ${sel&&sel.mi===mi&&sel.c===cn&&sel.t===tt?'on':''}" data-mi="${mi}" data-c="${cn}" data-t="${tt}" data-f="${ff}"><span class="t">${tt}</span><span class="f">${ff}</span></button>`}).join("")}</div></div>`).join("")}</div></div>`;
  }).join("");
}
function seatmap(id){
  const cols=14,rows=8,grid=document.createElement("div");
  grid.className="grid";grid.style.gridTemplateColumns=`repeat(${cols},10px)`;
  let n=0;const seed=id.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd=()=>{const x=Math.sin(n++*seed)*10000;return x-Math.floor(x)};
  let av=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const rv=rnd(),wc=(c===0||c===cols-1)&&r%3===0;
    const cls=wc?"wc":rv<.72?"av":rv<.9?"":"held";
    if(cls==="av")av++;
    const b=document.createElement("button");b.className=`seat ${cls}`;grid.appendChild(b);
  }
  const wrap=document.createElement("div");wrap.className="map-inner";
  wrap.innerHTML=`<div class="screen"></div><div class="screen-label">SCREEN</div><div class="area-label">Katsomo</div>`;
  wrap.appendChild(grid);
  wrap.innerHTML+=`<div class="legend"><span><i class="dot" style="background:var(--free)"></i>Available</span><span><i class="dot" style="background:var(--sold)"></i>Unavailable</span><span><i class="dot" style="background:var(--hold)"></i>Held</span></div>`;
  return [wrap,av];
}
function load(mi,c,t,f){
  const [name]=DATA[mi];
  sel={mi,c,t};
  render();
  document.querySelector("#sTitle").textContent=name;
  document.querySelector("#sSub").textContent=`${c||"All cinemas"} · ${f} · ${t}`;
  const [map,av]=seatmap(t+name+c);
  const m=document.querySelector("#map");m.innerHTML="";m.appendChild(map);
  document.querySelector("#stats").innerHTML=`<span><strong>${av}</strong> free</span><span><strong>${Math.round(av/(14*8)*100)}%</strong> open</span>`;
}
document.querySelector("#rows").onclick=e=>{
  const chip=e.target.closest(".chip");
  if(chip)return load(+chip.dataset.mi,chip.dataset.c,chip.dataset.t,chip.dataset.f);
};
document.querySelector("#scope").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#scope button").forEach(x=>x.classList.toggle("active",x===b));render()};
document.querySelector("#q").oninput=render;
renderDays();render();
</script>
</html>
