name: Refresh Finnkino token

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install 'curl-cffi>=0.13,<1'

      - run: python deploy/fetch_token.py > .finnkino-token

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - run: |
          ssh-keyscan -H vps.asad.dev >> ~/.ssh/known_hosts
          bash deploy/push-token.sh .finnkino-token
