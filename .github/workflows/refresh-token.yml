name: Refresh Finnkino token

# GitHub-hosted runners cannot scrape finnkino.fi (Cloudflare). The Mac launchd
# job runs deploy/refresh-token.sh every 6h and updates the FINNKINO_TOKEN secret.
# Use this workflow manually if you need to push the cached secret to the VPS.

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write token from secret
        env:
          TOKEN: ${{ secrets.FINNKINO_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "FINNKINO_TOKEN secret is not set" >&2
            exit 1
          fi
          printf '%s' "$TOKEN" > .finnkino-token

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - run: |
          ssh-keyscan -H vps.asad.dev >> ~/.ssh/known_hosts
          bash deploy/push-token.sh .finnkino-token
