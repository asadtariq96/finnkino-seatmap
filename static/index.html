</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={sites:[],payload:null,date:"",city:"All",site:"All",experience:"All",active:"",selectedFilm:"",activePref:null};
const EXPERIENCES=["All","IMAX","LUXE","iSense","Maxim","3D","Standard"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seatCache=new Map(),SEAT_FRESH=45000,SEAT_STALE=600000,scheduleCache=new Map(),SCHEDULE_FRESH=300000,SCHEDULE_STALE=3600000;
const seatInflight=new Map(),seatRefreshQ=[],seatRefreshActive=new Set();
let seatRefreshTimer=null;
const api=async url=>{const r=await fetch(url),d=await r.json();if(!r.ok||d.error)throw Error(d.error||r.statusText);return d};
function putSeat(id,data){seatCache.set(id,{data,freshExp:Date.now()+SEAT_FRESH,staleExp:Date.now()+SEAT_STALE})}
function getSeat(id){const hit=seatCache.get(id);if(!hit)return null;const now=Date.now();if(now<=hit.staleExp)return{data:hit.data,fresh:now<=hit.freshExp};seatCache.delete(id);return null}
async function fetchSchedule(date){const hit=scheduleCache.get(date),now=Date.now();if(hit&&now<=hit.freshExp)return hit.data;if(hit&&now<=hit.staleExp){api(`/api/movies?date=${date}`).then(d=>scheduleCache.set(date,{data:d,freshExp:Date.now()+SCHEDULE_FRESH,staleExp:Date.now()+SCHEDULE_STALE})).catch(()=>{});return hit.data}const data=await api(`/api/movies?date=${date}`);scheduleCache.set(date,{data,freshExp:Date.now()+SCHEDULE_FRESH,staleExp:Date.now()+SCHEDULE_STALE});return data}
function queueSeatRefresh(id){if(seatRefreshActive.has(id)||seatInflight.has(id))return;if(seatRefreshQ.includes(id))return;seatRefreshQ.push(id);drainSeatRefresh()}
function drainSeatRefresh(){while(seatRefreshActive.size<2&&seatRefreshQ.length){const id=seatRefreshQ.shift();seatRefreshActive.add(id);fetchSeatmap(id,{background:true}).finally(()=>{seatRefreshActive.delete(id);drainSeatRefresh()})}}
async function fetchSeatmap(id,opts={}){const cached=getSeat(id);if(cached&&!opts.force){if(!cached.fresh)queueSeatRefresh(id);return cached.data}if(seatInflight.has(id))return seatInflight.get(id);const p=(async()=>{try{const data=await api(`/api/seatmap?showtime=${encodeURIComponent(id)}`);putSeat(id,data);if(opts.background)applySeatRefresh(id,data);return data}catch(e){const hit=getSeat(id);if(hit)return hit.data;throw e}finally{seatInflight.delete(id)}})();seatInflight.set(id,p);return p}
function applySeatRefresh(id,data){if(state.active===id&&!document.querySelector("#gridToggle").classList.contains("on"))renderMap(data,true);document.querySelectorAll(`.minimap[data-show="${CSS.escape(id)}"]`).forEach(c=>{if(c.dataset.loaded)renderMiniMap(c,data)})}

$("#shows").onclick=e=>{const b=e.target.closest("[data-show]");if(b){loadSeatmap(b.dataset.show,b.dataset.film,b.dataset.start,b.dataset.format,b.dataset.site);return}const movie=e.target.closest(".movie");if(movie){persistFilm(movie.dataset.filmId);const chip=movie.querySelector(".chip:not(.sold)");if(chip)loadSeatmap(chip.dataset.show,chip.dataset.film,chip.dataset.start,chip.dataset.format,chip.dataset.site);else renderShows()}};
let searchTimer;
$("#search").oninput=()=>{syncSearchClear();clearTimeout(searchTimer);searchTimer=setTimeout(applySearch,150)};
$("#searchClear").onclick=()=>{$("#search").value="";syncSearchClear();applySearch();$("#search").focus()};
document.onkeydown=e=>{if(e.key==="/"&&!/input|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#search").focus();return}if(e.key==="Escape"&&document.activeElement===$("#search")){$("#search").value="";syncSearchClear();applySearch();$("#search").blur();return}if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;const sel=document.querySelector(".movie.sel");const chips=sel?[...sel.querySelectorAll(".chip:not(.sold)")]:[...document.querySelectorAll(".chip:not(.sold)")];const idx=chips.findIndex(c=>c.classList.contains("active"));if(idx<0)return;e.preventDefault();let next=idx;if(e.key==="ArrowRight"||e.key==="ArrowDown")next=Math.min(chips.length-1,idx+1);if(e.key==="ArrowLeft"||e.key==="ArrowUp")next=Math.max(0,idx-1);if(next!==idx)chips[next].click()};let rsTimer;window.onresize=()=>{clearTimeout(rsTimer);rsTimer=setTimeout(()=>{fitMap();refitMiniMaps()},80)};
(async function init(){renderDays();try{const d=await api("/api/sites");state.sites=(d.sites||[]).sort((a,b)=>a.name.text.localeCompare(b.name.text));const saved=localStorage.getItem("seatflash-site");state.site=state.sites.some(s=>s.id===saved)?saved:"All";const savedCity=localStorage.getItem("seatflash-city");state.city=savedCity&&cities().includes(savedCity)?savedCity:"All";if(state.site!=="All")state.city=siteCity(state.sites.find(s=>s.id===state.site));const savedFilm=localStorage.getItem("seatflash-film");if(savedFilm)state.selectedFilm=savedFilm;const savedPrefSite=localStorage.getItem("seatflash-pref-site"),savedPrefTime=localStorage.getItem("seatflash-pref-time");if(savedPrefSite&&savedPrefTime)state.activePref={siteId:savedPrefSite,time:savedPrefTime};const savedExp=localStorage.getItem("seatflash-experience");if(savedExp&&EXPERIENCES.includes(savedExp))state.experience=savedExp;renderCitySelect();renderCinemaSelect();$("#experience").innerHTML=EXPERIENCES.map(x=>`<button class="${x===state.experience?'active':''}" data-experience="${x}">${x}</button>`).join("");syncSearchClear();loadSchedule()}catch(e){$("#shows").innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script>
</html>
