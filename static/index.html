:root{color-scheme:dark;--bg:#0a0c12;--panel:#0f131b;--raised:#161c26;--hover:#1b2230;--line:#232c3a;--soft-line:#171d28;--text:#eef1f6;--muted:#96a0b1;--dim:#5e6877;--accent:#f3bc4b;--accent-ink:#17120a;--screen:#7fb7e0;--free:#2eaf53;--sold:#34363b;--hold:#d8b94a;--danger:#ff7c86;--font-display:'Saira Condensed',system-ui,sans-serif;--font-body:'Instrument Sans',system-ui,'Segoe UI',sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 var(--font-body);font-feature-settings:"cv01","ss03"}button,select,input{font:inherit;color:inherit}button{cursor:pointer}::selection{background:rgba(243,188,75,.22)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--screen);outline-offset:1px}.shell{height:100dvh;display:grid;grid-template-rows:46px 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}.brand{display:flex;align-items:center;gap:9px;font:700 15px/1 var(--font-display);letter-spacing:.045em;text-transform:uppercase;white-space:nowrap}.brand i{display:inline-block;width:7px;height:7px;border-radius:2px 2px 3px 3px;background:var(--accent);box-shadow:0 0 12px rgba(243,188,75,.6),-12px 0 0 -1px var(--dim),12px 0 0 -1px var(--dim)}.days{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}.day{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;font:600 13px/1 var(--font-display);letter-spacing:.01em}.day:hover{background:var(--hover);color:var(--text)}.day.active{background:var(--accent);border-color:#ffd06a;color:var(--accent-ink)}.select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--raised);color:var(--text);padding:0 6px;outline:none;max-width:230px}.select:focus,.search:focus{border-color:rgba(127,183,224,.55);box-shadow:0 0 0 px;scrollbar-width:thin;scrollbar-color:#2a3342 transparent}.day-block{margin-bottom:14px}.day-title{font:600 13px/1.2 var(--font-display);letter-spacing:.02em;color:var(--text);padding:6px 2px;border-bottom:1px solid var(--soft-line);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}.day-title span{font:9px ui-monospace,monospace;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}.mm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.minimap{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--raised);text-align:left;color:var(--text);cursor:pointer}.minimap:hover{border-color:var(--accent);background:var(--hover)}.minimap.sold{opacity:.4;cursor:default}.minimap.sold:hover{border-color:var(--line);background:var(--raised)}.mm-top{display:flex;align-items:baseline;gap:6px}.mm-time{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}.mm-fmt{font:8.5px ui-monospace,monospace;color:var(--muted);letter-spacing:.3px;margin-left:auto}.mm-title{font:600 12.5px/1.15 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mm-cinema{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mm-stage{display:flex;flex-direction:column;gap:4px;margin-top:2px;min-height:56px;justify-content:center;align-items:center}.mm-screen{width:64%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--screen) 20% 80%,transparent);opacity:.85}.mm-row{display:grid;gap:1.5px;justify-content:center}.mm-seat{width:5px;height:5px;border-radius:1px;background:var(--sold);border:0;padding:0;pointer-events:none}.mm-seat.available{background:var(--free)}.mm-seat.held,.mm-seat.reserved{background:var(--hold)}.mm-seat.wc{border-radius:50%}.mm-stats{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}.mm-stats strong{color:var(--text)}.mm-loading{color:var(--dim);font-size:10px;text-align:center;padding:10px 0}.seatmap{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;padding:12px 16px 22px}.seatmap.grid-on{display:flex;flex-direction:column;padding:0;align-items:stretch}.map-inner{min-width:min-content;max-width:100%;max-height:100%}.screen-bottom{margin-top:10px}.screen{height:5px;margin:0 auto 5px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--screen) 15% 85%,transparent);box-shadow:0 -7px 24px rgba(127,183,224,.28);width:75%}.screen-label{text-align:center;color:var(--dim);font:9px ui-monospace,monospace;letter-spacing:2px}.area-name{text-align:center;color:var(--muted);font-size:10px;margin:6px}.row{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center;margin:2px 0}.row-label{font:10px ui-monospace,monospace;text-align:right;color:var(--dim)}.seat-row{display:grid;gap:2px;grid-template-columns:repeat(var(--cols,1),var(--seat,11px))}.seat{width:var(--seat,11px);height:var(--seat,11px);border:0;border-radius:max(2px,calc(var(--seat,11px)/4));padding:0;background:var(--sold);outline:none;position:relative}.seat.available{background:var(--free)}.seat.held,.seat.reserved{background:var(--hold)}.seat.wheelchair{border-radius:50%}.seat:hover{transform:scale(1.55);z-index:2;box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(127,183,224,.35)}.legend{display:flex;justify-content:center;gap:12px;margin-top:10px;color:var(--muted);font-size:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.empty,.loading,.error{margin:auto;color:var(--muted);text-align:center;padding:24px}.loading:before{content:"";display:block;width:20px;height:20px;margin:0 auto 9px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite}.error{color:var(--danger)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes seat-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@keyframes screen <div class="shell">
<header class="top">
  <div class="brand"><i></i>SeatFlash</div>
  <div id="days" class="days"></div>
  <select id="cinema" class="select" aria-label="Cinema"></select>
  <div id="experience" class="experience" aria-label="Cinema experience"></div>
  <input id="search" class="search" placeholder="Filter movies…" aria-label="Filter movies" autocomplete="off">
</header>
<main class="main">
  <section class="list">
    <div class="list-head"><span id="scopeLabel">All cinemas</span><span id="count"></span></div>
    <div id="shows" class="shows"><div class="loading">Loading showtimes</div></div>
  </section>
  <aside class="seatpane">
    <div class="seat-head"><div><div id="mapTitle" class="title">Select a show</div><div id="mapSub" class="sub">Picking the first showtime…</div></div><button id="gridToggle" class="grid-toggle" aria-pressed="false"><i></i>7-day grid</button><div id="stats" class="stats"></div></div>
    <div id="seatmap" class="seatmap"><div class="empty">Loading seats</div></div>
  </aside>
</main>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={sites:[],payload:null,date:"",site:"All",experience:"All",active:"",selectedFilm:""};
const EXPERIENCES=["All","IMAX","LUXE","iSense","Maxim","3D","Standard"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async url=>{const r=await fetch(url),d=await r.json();if(!r.ok||d.error)throw Error(d.error||r.statusText);return d};
function dayISO(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("en-CA")}
function siteCity(site){return site?.contactDetails?.address?.city||"Other"}
function siteName(id){return state.sites.find(site=>site.id===id)?.name?.text||id}
function renderDays(){state.date=state.date||dayISO();const names=["Today","Tomorrow"];$("#days").innerHTML=Array.from({length:7},(_,i)=>{const d=dayISO(i),date=new Date(d+"T12:00:00"),label=names[i]||date.toLocaleDateString("en",{weekday:"short",day:"numeric"});return `<button class="day ${d===state.date?'active':''}" data-date="${d}">${label}</button>`}).join("")}
function relatedFilms(p){const r=p?.relatedData||{},raw=r.films||r.film||[],list=Array.isArray(raw)?raw:Object.values(raw||{});return new Map(list.map(f=>[f.id,f]))}
function filmTitle(f,id){return f?.title?.text||f?.name?.text||id}
function relatedAttributes(p){const raw=p?.relatedData?.attributes||[],list=Array.isArray(raw)?raw:Object.values(raw||{});return new Map(list.map(a=>[a.id,a]))}
function showFormat(show,attrs=relatedAttributes(state.payload)){const labels=(show.attributeIds||[]).map(id=>attrs.get(id)).filter(Boolean).map(a=>a?.shortName?.text||a?.name?.text).filter(Boolean),premium=labels.filter(label=>["IMAX","LUXE","ISENSE","MAXIM"].includes(label.toUpperCase())),dimensional=labels.find(label=>label.toUpperCase()==="3D");if(premium.length)return[...premium,dimensional].filter(Boolean).join(" · ");if(dimensional)return dimensional;return labels.find(label=>label.toUpperCase()==="2D")||"Standard"}
function matchesExperience(show,attrs){if(state.experience==="All")return true;const format=showFormat(show,attrs).toUpperCase();if(state.experience==="Standard")return !["IMAX","LUXE","ISENSE","MAXIM","3D"].some(x=>format.includes(x));return format.includes(state.experience.toUpperCase())}
function filteredShows(){const attrs=relatedAttributes(state.payload);return(state.payload?.showtimes||[]).filter(show=>matchesExperience(show,attrs)&&(state.site==="All"||show.siteId===state.site))}
function groupedMovies(shows){const films=relatedFilms(state.payload),groups=new Map;for(const show of shows){const title=filmTitle(films.get(show.filmId),show.filmId);if(!groups.has(show.filmId))groups.set(show.filmId,{id:show.filmId,title,shows:[]});groups.get(show.filmId).shows.push(show)}return[...groups.values()].sort((a,b)=>a.title.localeCompare(b.title))}
function searchGroups(groups){const q=$("#search").value.trim().toLowerCase();return q?groups.filter(g=>g.title.toLowerCase().includes(q)):groups}
function renderCinemaSelect(){const cities=["All",...new Set(state.sites.map(siteCity).sort((a,b)=>a.localeCompare(b)))];let html=`<option value="All">All cinemas</option>`;for(const city of cities.filter(c=>c!=="All")){html+=`<optgroup label="${esc(city)}">`+state.sites.filter(s=>siteCity(s)===city).sort((a,b)=>a.name.text.localeCompare(b.name.text)).map(s=>`<option value="${s.id}" ${s.id===state.site?'selected':''}>${esc(s.name.text)}</option>`).join("")+"</optgroup>"}$("#cinema").innerHTML=html;if(state.site!=="All"&&!state.sites.some(s=>s.id===state.site))state.site="All"}
function timeButton(show,title,attrs){const format=showFormat(show,attrs),start=show.schedule.startsAt;return `<button class="chip ${show.id===state.active?'active':''} ${show.isSoldOut?'sold':''}" data-show="${esc(show.id)}" data-film="${esc(title)}" data-start="${esc(start)}" data-format="${esc(format)}" data-site="${esc(show.siteId)}" title="${esc(siteName(show.siteId))} · ${esc(format)}" ${show.isSoldOut?'disabled':''}><span class="clock">${new Date(start).toLocaleTimeString("fi",{hour:"2-digit",minute:"2-digit"})}</span><span class="format">${esc(format)}</span></button>`}
function renderShows(){const attrs=relatedAttributes(state.payload),groups=searchGroups(groupedMovies(filteredShows()));if(!groups.some(g=>g.id===state.selectedFilm))state.selectedFilm=groups[0]?.id||"";$("#scopeLabel").textContent=state.site==="All"?"All cinemas":siteName(state.site);$("#count").textContent=`${groups.length} film${groups.length===1?"":"s"}`;$("#shows").innerHTML=groups.length?groups.map(g=>{const bySite=new Map;for(const show of g.shows){if(!bySite.has(show.siteId))bySite.set(show.siteId,[]);bySite.get(show.siteId).push(show)}const groupsHtml=[...bySite].sort((a,b)=>siteName(a[0]).localeCompare(siteName(b[0]))).map(([siteId,shows])=>`<div class="cg"><div class="cg-name">${esc(siteName(siteId))}</div><div class="times">${shows.sort((a,b)=>a.schedule.startsAt.localeCompare(b.schedule.startsAt)).map(s=>timeButton(s,g.title,attrs)).join("")}</div></div>`).join("");return `<div class="movie ${g.id===state.selectedFilm?'sel':''}"><div class="m-row"><span class="m-name">${esc(g.title)}</span><span class="m-fmt">${esc(showFormat(g.shows[0],attrs))}</span></div><div class="cinemas">${groupsHtml}</div></div>`}).join(""):`<div class="empty">No showtimes match these filters</div>`;return groups}
function showTitle(show){return filmTitle(relatedFilms(state.payload).get(show.filmId),show.filmId)}
function resetSeatmap(msg="Select a show"){state.active="";$("#mapTitle").textContent="Select a show";$("#mapSub").textContent="Choose a showtime to view live seats";$("#stats").textContent="";$("#seatmap").innerHTML=`<div class="empty">${esc(msg)}</div>`}
function renderMap(data){const areas=data.areas||[],body=areas.map(a=>`<div class="area"><div class="area-name">${esc(a.name)}</div>${a.rows.map(r=>{const max=Math.max(1,...r.seats.map(s=>s.position.columnNumber||1));return `<div class="row"><span class="row-label">${esc(r.label)}</span><div class="seat-row" style="grid-template-columns:repeat(${max},var(--seat,11px))">${r.seats.map(s=>`<button class="seat ${s.status.toLowerCase()} ${s.type.toLowerCase()}" style="grid-column:${s.position.columnNumber}" title="Row ${esc(s.rowLabel)} · Seat ${esc(s.label)} · ${esc(s.status)}" aria-label="Row ${esc(s.rowLabel)}, seat ${esc(s.label)}, ${esc(s.status)}"></button>`).join("")}</div></div>`}).join("")}</div>`).join("");$("#seatmap").innerHTML=`<div class="map-inner">${body}<div class="screen-bottom"><div class="screen"></div><div class="screen-label">SCREEN</div></div><div class="legend"><span><i class="dot" style="background:var(--free)"></i>Available</span><span><i class="dot" style="background:var(--sold)"></i>Unavailable</span><span><i class="dot" style="background:var(--hold)"></i>Held</span></div></div>`;const c=data.counts,pct=c.total?Math.round(c.available/c.total*100):0;$("#stats").innerHTML=`<span><strong>${c.available}</strong> free</span><span><strong>${pct}%</strong> open</span>`;requestAnimationFrame(fitMap)}
function fitMap(){const pane=$("#seatmap"),inner=document.querySelector(".map-inner");if(!inner)return;const rows=inner.querySelectorAll(".row").length,cols=Math.max(1,...[...inner.querySelectorAll(".seat-row")].map(r=>r.children.length));if(!rows||!cols)return;const W=pane.clientWidth-40,H=pane.clientHeight-128;const seat=Math.max(6,Math.min(56,Math.floor(Math.min(W/(cols*1.21),H/(rows*1.21)))));inner.style.setProperty("--seat",seat+"px")}
async function loadSeatmap(id,title,start,format,siteId,rerender=true){state.active=id;if(rerender)renderShows();$("#mapTitle").textContent=title;$("#mapSub").textContent=`${siteName(siteId)} · ${format} · ${new Date(start).toLocaleString("en",{weekday:"short",hour:"2-digit",minute:"2-digit"})}`;$("#stats").textContent="";$("#seatmap").innerHTML='<div class="loading">Fetching live seats</div>';try{renderMap(await api(`/api/seatmap?showtime=${encodeURIComponent(id)}`))}catch(e){$("#seatmap").innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function autoSelect(groups){const shows=(groups||searchGroups(groupedMovies(filteredShows()))).flatMap(g=>g.shows).filter(s=>!s.isSoldOut);if(!shows.length){resetSeatmap("No available showtimes");return}const keep=shows.find(s=>s.id===state.active)||shows.find(s=>s.id===state.active&&false);const pick=keep||shows[0];loadSeatmap(pick.id,showTitle(pick),pick.schedule.startsAt,showFormat(pick),pick.siteId,false)}
let gridObserver=null,gridBusy=false;
function dayLabel(i){const names=["Today","Tomorrow"],d=new Date(dayISO(i)+"T12:00:00");return names[i]||d.toLocaleDateString("en",{weekday:"short",day:"numeric"})}
function gridShows(payload){const attrs=relatedAttributes(payload),films=relatedFilms(payload),q=$("#search").value.trim().toLowerCase();return(payload?.showtimes||[]).map(s=>({show:s,title:filmTitle(films.get(s.filmId),s.filmId),format:showFormat(s,attrs),attrs})).filter(x=>matchesExperience(x.show,x.attrs)&&(state.site==="All"||x.show.siteId===state.site)&&(!q||x.title.toLowerCase().includes(q)))}
async function loadMiniMap(card){const id=card.dataset.show;if(card.dataset.loaded)return;card.dataset.loaded="1";try{const data=await api(`/api/seatmap?showtime=${encodeURIComponent(id)}`);renderMiniMap(card,data)}catch(e){const st=card.querySelector(".mm-stage");if(st)st.innerHTML=`<span class="mm-loading">${esc(e.message)}</span>`}}
function renderMiniMap(card,data){const areas=data.areas||[],c=data.counts||{};let maxCols=1,rowsHtml="";for(const a of areas)for(const r of a.rows){const m=Math.max(1,...r.seats.map(s=>s.position.columnNumber||1));if(m>maxCols)maxCols=m;rowsHtml+=`<div class="mm-row" style="grid-template-columns:repeat(${m},5px)">${r.seats.map(s=>`<span class="mm-seat ${s.status.toLowerCase()} ${s.type.toLowerCase()==="wheelchair"?"wc":""}" style="grid-column:${s.position.columnNumber}"></span>`).join("")}</div>`}const stage=card.querySelector(".mm-stage");if(stage)stage.innerHTML=`<span class="mm-screen"></span>${rowsHtml}`;const stats=card.querySelector(".mm-stats"),pct=c.total?Math.round(c.available/c.total*100):0;if(stats)stats.innerHTML=`<span><strong>${c.available??"–"}</strong> free</span><span>${pct}% open</span>`}
function renderGridView(){gridBusy=true;$("#mapTitle").textContent="7-day grid";$("#mapSub").textContent="Every showtime, next 7 days · click a map to open";$("#stats").textContent="";$("#seatmap").innerHTML=`<div class="grid-view"><div class="loading">Loading 7 days…</div></div>`;const dates=Array.from({length:7},(_,i)=>dayISO(i));Promise.all(dates.map(d=>api(`/api/movies?date=${d}`))).then(pls=>{const gv=document.querySelector(".grid-view");if(!gv)return;const html=dates.map((d,i)=>{const rows=gridShows(pls[i]).sort((a,b)=>a.title.localeCompare(b.title));const cards=rows.map(x=>{const s=x.show,start=s.schedule.startsAt;const fmt=x.format.replace(/ · /g," · ");return `<button class="minimap ${s.isSoldOut?"sold":""}" data-show="${esc(s.id)}" data-date="${d}" data-film="${esc(x.title)}" data-start="${esc(start)}" data-format="${esc(fmt)}" data-site="${esc(s.siteId)}" title="${esc(siteName(s.siteId))}"><span class="mm-top"><span class="mm-time">${new Date(start).toLocaleTimeString("fi",{hour:"2-digit",minute:"2-digit"})}</span><span class="mm-fmt">${esc(fmt)}</span></span><span class="mm-title">${esc(x.title)}</span><span class="mm-cinema">${esc(siteName(s.siteId))}</span><span class="mm-stage">${s.isSoldOut?'<span class="mm-loading">Sold out</span>':'<span class="mm-loading">…</span>'}</span><span class="mm-stats">${s.isSoldOut?"<span>0 free</span><span>–</span>":""}</span></button>`}).join("");return rows.length?`<section class="day-block"><div class="day-title">${dayLabel(i)}<span>${d} · ${rows.length} shows</span></div><div class="mm-grid">${cards}</div></section>`:""}).join("");gv.innerHTML=html;if(gridObserver)gridObserver.disconnect();gridObserver=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)loadMiniMap(en.target)})},{root:gv,rootMargin:"200px"});document.querySelectorAll(".minimap:not(.sold)").forEach(c=>gridObserver.observe(c));gridBusy=false}).catch(e=>{const gv=document.querySelector(".grid-view");if(gv)gv.innerHTML=`<div class="error">${esc(e.message)}</div>`;gridBusy=false})}
function openFromGrid(card){if(state.date!==card.dataset.date){state.date=card.dataset.date;renderDays();loadSchedule()}else{loadSeatmap(card.dataset.show,card.dataset.film,card.dataset.start,card.dataset.format,card.dataset.site)}exitGrid()}
function enterGrid(){document.querySelector("#gridToggle").classList.add("on");document.querySelector("#gridToggle").setAttribute("aria-pressed","true");document.querySelector("#seatmap").classList.add("grid-on");renderGridView()}
function exitGrid(){document.querySelector("#gridToggle").classList.remove("on");document.querySelector("#gridToggle").setAttribute("aria-pressed","false");document.querySelector("#seatmap").classList.remove("grid-on");if(gridObserver){gridObserver.disconnect();gridObserver=null}}
async function loadSchedule(){if(!state.date)return;state.payload=null;$("#shows").innerHTML='<div class="loading">Loading every cinema</div>';resetSeatmap("Loading…");try{state.payload=await api(`/api/movies?date=${state.date}`);renderCinemaSelect();const groups=renderShows();autoSelect(groups)}catch(e){$("#shows").innerHTML=`<div class="error">${esc(e.message)}</div>`}}
$("#days").onclick=e=>{const b=e.target.closest("[data-date]");if(!b)return;state.date=b.dataset.date;renderDays();if(document.querySelector("#gridToggle").classList.contains("on"))renderGridView();else loadSchedule()};
$("#cinema").onchange=e=>{state.site=e.target.value;localStorage.setItem("seatflash-site",state.site);if(document.querySelector("#gridToggle").classList.contains("on"))renderGridView();else{const groups=renderShows();autoSelect(groups)}};
$("#experience").onclick=e=>{const b=e.target.closest("[data-experience]");if(!b)return;state.experience=b.dataset.experience;if(document.querySelector("#gridToggle").classList.contains("on"))renderGridView();else{const groups=renderShows();autoSelect(groups)}};
$("#gridToggle").onclick=()=>{if(document.querySelector("#gridToggle").classList.contains("on")){exitGrid();if(state.active){const c=document.querySelector(`.chip[data-show="${CSS.escape(state.active)}"]`);if(c)loadSeatmap(c.dataset.show,c.dataset.film,c.dataset.start,c.dataset.format,c.dataset.site);else loadSchedule()}}else enterGrid()};
$("#seatmap").onclick=e=>{const card=e.target.closest(".minimap");if(card&&!card.classList.contains("sold")&&!card.querySelector(".mm-loading")&&card.dataset.loaded)openFromGrid(card)};
$("#shows").onclick=e=>{const b=e.target.closest("[data-show]");if(b)loadSeatmap(b.dataset.show,b.dataset.film,b.dataset.start,b.dataset.format,b.dataset.site)};
$("#search").oninput=()=>{if(document.querySelector("#gridToggle").classList.contains("on")){renderGridView();return}const groups=renderShows();if(!groups.some(g=>g.shows.some(s=>s.id===state.active)))autoSelect(groups)};
document.onkeydown=e=>{if(e.key==="/"&&!/input|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#search").focus()}};let rsTimer;window.onresize=()=>{clearTimeout(rsTimer);rsTimer=setTimeout(fitMap,80)};
(async function init(){renderDays();try{const d=await api("/api/sites");state.sites=(d.sites||[]).sort((a,b)=>a.name.text.localeCompare(b.name.text));const saved=localStorage.getItem("seatflash-site");state.site=state.sites.some(s=>s.id===saved)?saved:"All";renderCinemaSelect();$("#experience").innerHTML=EXPERIENCES.map(x=>`<button class="${x===state.experience?'active':''}" data-experience="${x}">${x}</button>`).join("");loadSchedule()}catch(e){$("#shows").innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script>
</html>
